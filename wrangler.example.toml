name = "classmoney-2-0"
main = "src/index.ts"
compatibility_date = "2026-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

# Daily email digests run against each user's local time.
[triggers]
crons = ["*/5 * * * *"]

# Set BREVO_API_KEY as a Worker secret and configure a verified sender.
# Set APP_URL to the public application URL to show the digest button.

# Configure your own D1 database after creating it.
# [[d1_databases]]
# binding = "DB"
# database_name = "classmoney"
# database_id = "YOUR_DATABASE_ID"
